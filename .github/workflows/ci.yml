name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        shell: pwsh
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.1" "ndk;27.3.13750724"
          $ndk = Join-Path $env:ANDROID_HOME 'ndk\27.3.13750724'
          "ANDROID_NDK_HOME=$ndk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install WebUI dependencies
        working-directory: web
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install chromium

      - name: Run WebUI tests
        working-directory: web
        run: npm test

      - name: Assert release version
        shell: pwsh
        run: .\scripts\assert-release-version.ps1 -Tag v1.0.0

      - name: Build and package
        shell: pwsh
        run: .\scripts\package.ps1

      - name: Upload module artifact
        uses: actions/upload-artifact@v4
        with:
          name: vmq-ksu-v1.0.0-arm64-api35
          path: |
            dist/*.zip
            dist/*.sha256
